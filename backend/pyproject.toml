[project]
name = "document-conversion-engine"
version = "0.1.0"
description = "Document Conversion Engine: Document → Extract/OCR → Structure → Document Model → Markdown"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "alembic>=1.14",
    "httpx>=0.27",
    "pillow>=11.0",
    "python-docx>=1.1",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "redis>=5.0",
    "rq>=1.16",
    "structlog>=25.4",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
